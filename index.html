<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Drive a Roadster-style hypercar with cold-gas thrusters through real downtown San Francisco, then hold Space and lift off between the towers. Runs in the browser." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Roadster — a flying-car game in your browser" />
  <meta property="og:description" content="Real downtown San Francisco from OpenStreetMap and USGS terrain, 250 AI cars that obey the lights, cold-gas thrusters: hold Space and fly between the towers." />
  <meta property="og:url" content="https://brandeispatrick.github.io/roadster/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/BrandeisPatrick/roadster/main/press/aerial.jpg" />
  <meta property="og:image:width" content="1600" />
  <meta property="og:image:height" content="1392" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Roadster — a flying-car game in your browser" />
  <meta name="twitter:description" content="Real downtown San Francisco, 250 AI cars, cold-gas thrusters. Hold Space and lift off between the towers." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/BrandeisPatrick/roadster/main/press/aerial.jpg" />
  <title>Roadster — Flying Car</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ddd; background: #06080c; z-index: 100; }
    #loading .bar { width: 320px; height: 4px; background: #222; margin-top: 16px; border-radius: 2px; overflow: hidden; }
    #loading .bar > div { height: 100%; width: 0%; background: #e82127; transition: width .2s; }
    #loading small { opacity: .6; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <h2 style="margin:0;font-weight:500;letter-spacing:.2em">ROADSTER</h2>
    <div class="bar"><div id="loading-bar"></div></div>
    <small id="loading-text">Loading city…</small>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
